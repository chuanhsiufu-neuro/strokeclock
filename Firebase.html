<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroke Clock 共同編輯區</title>
    <style>
        body { font-family: sans-serif; padding: 20px; text-align: center; }
        textarea { width: 90%; max-width: 500px; height: 200px; font-size: 18px; padding: 10px; }
    </style>
</head>
<body>

    <h2>📝 多人即時同步記事本</h2>
    <p>這是一個測試！打開兩個視窗打字看看，畫面會同步喔！</p>
    
    <textarea id="sharedText" placeholder="請在這裡輸入文字..."></textarea>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-app.js";
        import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.1/firebase-database.js";

        // 這是你剛剛貼給我的，你專屬的身分證！
        const firebaseConfig = {
            apiKey: "AIzaSyAONpteh2AGI6UiseiNBOAM6jU5zRGXY24",
            authDomain: "strokeclock.firebaseapp.com",
            databaseURL: "https://strokeclock-default-rtdb.firebaseio.com",
            projectId: "strokeclock",
            storageBucket: "strokeclock.firebasestorage.app",
            messagingSenderId: "976968907961",
            appId: "1:976968907961:web:d484a85e20e8a872df2f68"
        };

        // 啟動 Firebase 引擎
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // 指定要存資料的雲端資料夾位置 (路徑我們叫做 strokeClockData)
        const textRef = ref(db, 'strokeClockData');
        const textArea = document.getElementById('sharedText');

        // 【讀取】只要雲端資料有變，就更新畫面
        onValue(textRef, (snapshot) => {
            const data = snapshot.val();
            if (data !== null && data !== textArea.value) {
                textArea.value = data;
            }
        });

        // 【寫入】只要你在框框裡打字，就立刻傳到雲端
        textArea.addEventListener('input', function() {
            set(textRef, textArea.value);
        });

    </script>
</body>
</html>
