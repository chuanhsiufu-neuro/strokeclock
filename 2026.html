<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stroke Clock</title>
    <style>
        /* 手機優先設計 (流動版佈局) */
        body {
            font-family: "Microsoft JhengHei", Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            padding: 15px; /* 手機上較小的內邊距 */
            text-align: center; 
            margin: 0;
        }
        
        h1 {
            color: #d32f2f;
            margin-top: 10px;
            margin-bottom: 5px;
            font-size: 28px;
        }

        .system-time {
            color: #666;
            font-size: 16px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        /* 調整輸入組在手機上的垂直堆疊佈局 */
        .input-group {
            margin-bottom: 25px;
            display: flex;
            flex-direction: column; /* 手機上垂直堆疊 */
            align-items: center;
            gap: 10px; /* 元素之間的間距 */
        }

        label {
            font-size: 20px;
            font-weight: bold;
        }

        /* 確保時間下拉選單有足夠的大小讓手指點擊，並全寬顯示 */
        input[type="datetime-local"] {
            font-size: 20px;
            padding: 10px;
            border: 2px solid #aaa;
            border-radius: 5px;
            cursor: pointer;
            width: 90%; /* 佔滿大約寬度 */
            max-width: 350px; /* 防止在寬屏幕上過寬 */
        }

        .btn-now {
            font-size: 18px;
            padding: 10px 20px;
            background-color: #6c757d;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            width: 90%; /* 全寬按鈕，方便點擊 */
            max-width: 350px;
        }

        .btn-now:hover {
            background-color: #5a6268;
        }

        .btn-start {
            font-size: 26px;
            font-weight: bold;
            padding: 15px 50px;
            background-color: #d32f2f; 
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
            transition: background-color 0.2s;
            width: 90%; /* 全寬啟動鈕 */
            max-width: 350px;
        }

        .btn-start:hover {
            background-color: #b71c1c;
        }

        #dtn-container {
            display: none; 
            margin-top: 40px;
        }

        h2 {
            font-size: 28px;
            color: #333;
            margin-bottom: 10px;
        }

        /* 電子時鐘樣式：黑底螢光字，字體大小修改為 96px */
        #digital-clock {
            font-size: 96px; /* 96字體大小 */
            font-family: 'Courier New', Courier, monospace; 
            background-color: #000; 
            color: #00ff00; 
            text-shadow: 0 0 15px #00ff00, 0 0 30px #00ff00; 
            display: inline-block;
            padding: 20px 30px;
            border-radius: 15px;
            border: 5px solid #444;
            letter-spacing: 5px;
            width: 90%; /* 時鐘也佔滿寬度 */
            max-width: 400px;
            box-sizing: border-box; /* 確保 padding 不增加寬度 */
        }

        /* 桌面屏幕的佈局微調 */
        @media (min-width: 600px) {
            .input-group {
                flex-direction: row; /* 寬屏幕回歸水平排列 */
                justify-content: center;
                gap: 15px;
            }

            input[type="datetime-local"] {
                width: auto;
                max-width: none;
            }

            .btn-now, .btn-start, #digital-clock {
                width: auto;
                max-width: none;
            }
        }
    </style>
</head>
<body>

    <h1>Stroke Clock</h1>
    <div class="system-time">目前系統時間：<span id="current-sys-time">載入中...</span></div>

    <div class="input-group">
        <label for="triage-time">檢傷時間：</label>
        <input type="datetime-local" id="triage-time" step="1">
        <button id="set-now-btn" class="btn-now">設為現在</button>
    </div>

    <div>
        <button id="start-btn" class="btn-start">Start!</button>
    </div>

    <div id="dtn-container">
        <h2>Door to needle time (DTN) =</h2>
        <div id="digital-clock">00:00</div>
    </div>

    <script>
        const sysTimeDisplay = document.getElementById('current-sys-time');
        const triageTimeInput = document.getElementById('triage-time');
        const setNowBtn = document.getElementById('set-now-btn');
        const startBtn = document.getElementById('start-btn');
        const dtnContainer = document.getElementById('dtn-container');
        const digitalClock = document.getElementById('digital-clock');
        
        let timerInterval;

        // 格式化時間，轉為 datetime-local 接受的格式 (YYYY-MM-DDThh:mm:ss)
        function getLocalIsoString(date) {
            const offset = date.getTimezoneOffset() * 60000;
            return (new Date(date - offset)).toISOString().slice(0, 19);
        }

        // 持續更新系統時間顯示 (24 小時制)
        function updateSystemTime() {
            const now = new Date();
            sysTimeDisplay.textContent = now.toLocaleString('zh-TW', { hour12: false });
        }
        setInterval(updateSystemTime, 1000);
        updateSystemTime();

        // 網頁載入時，自動將檢傷時間帶入「現在時間」
        triageTimeInput.value = getLocalIsoString(new Date());

        // 點擊「設為現在」按鈕的動作
        setNowBtn.addEventListener('click', function() {
            triageTimeInput.value = getLocalIsoString(new Date());
        });

        // 計算 DTN 的主邏輯
        function updateClock(triageTimestamp) {
            const now = new Date().getTime(); 
            let diff = now - triageTimestamp; 

            if (diff < 0) {
                digitalClock.textContent = "時間無效";
                return;
            }

            // 修改計算邏輯：不要小時，只顯示分跟秒
            // 計算總分鐘數（包含小時）
            const totalMinutes = Math.floor(diff / (1000 * 60));
            // 計算賸餘秒數
            const remainingSeconds = Math.floor((diff % (1000 * 60)) / 1000);

            // 格式化為兩位數 (分鐘可以超過兩位數，例如 120 分鐘顯示為 120)
            const formattedMinutes = String(totalMinutes).padStart(2, '0');
            const formattedSeconds = String(remainingSeconds).padStart(2, '0');

            // 組合輸出並顯示（分:秒）
            digitalClock.textContent = `${formattedMinutes}:${formattedSeconds}`;
        }

        // 按下 Start 的動作
        startBtn.addEventListener('click', function() {
            const triageValue = triageTimeInput.value;
            
            if (!triageValue) {
                alert("請先輸入檢傷時間！");
                return;
            }

            const triageTimestamp = new Date(triageValue).getTime();
            dtnContainer.style.display = 'block';

            if (timerInterval) {
                clearInterval(timerInterval);
            }

            updateClock(triageTimestamp);
            timerInterval = setInterval(function() {
                updateClock(triageTimestamp);
            }, 1000);
        });
    </script>

</body>
</html>
